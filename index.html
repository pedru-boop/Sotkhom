// เช่น ต้องการจ่าย 2,000 บาท ช่วงเบี้ยจริงที่ยังปัดเป็น 2,000 ได้คือ 1999.50–2000.49
// ใช้ขอบบนสุด (+0.49) ในการคำนวณทุนประกัน เพื่อให้ลูกค้าได้ทุนประกันสูงสุดโดยจ่ายเบี้ยเท่าเดิม
const ROUNDING_EDGE = 0.49;

const fmt = (n) =>
  Math.round(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });

function NumberField({ value, onChange, className }) {
  return (
    <input
      type="text"
      inputMode="numeric"
      value={value === "" ? "" : Number(value).toLocaleString("en-US")}
      onFocus={(e) => e.target.select()}
      onChange={(e) => {
        const raw = e.target.value.replace(/,/g, "").replace(/[^0-9.]/g, "");
        onChange(raw);
      }}
      className={className}
    />
  );
}

function calcIRR(cashflows) {
  function npv(rate) {
    return cashflows.reduce((sum, cf, t) => sum + cf / Math.pow(1 + rate, t), 0);
  }
  let low = -0.5, high = 1.0;
  let npvLow = npv(low), npvHigh = npv(high);
  if (npvLow * npvHigh > 0) return null;
  for (let i = 0; i < 100; i++) {
    const mid = (low + high) / 2;
    const npvMid = npv(mid);
    if (Math.abs(npvMid) < 1e-7) return mid;
    if (npvLow < 0 ? npvMid < 0 : npvMid > 0) { low = mid; npvLow = npvMid; } else { high = mid; }
  }
  return (low + high) / 2;
}

function SudKoomDashboard() {
  const [productKey, setProductKey] = useState("adult");
  const [productAuto, setProductAuto] = useState(true);
  const [plan, setPlan] = useState("15/9");
  const [gender, setGender] = useState("male");
  const [age, setAge] = useState("23");
  const [mode, setMode] = useState("premium");
  const [freqKey, setFreqKey] = useState("monthly");
  const [premiumInput, setPremiumInput] = useState(2000);
  const [sumInsuredInput, setSumInsuredInput] = useState(256000);
  const [fitScreen, setFitScreen] = useState(false);
  const [guardianGender, setGuardianGender] = useState("male");
  const [guardianAge, setGuardianAge] = useState("35");
  const [scale, setScale] = useState(1);
  const [scaledHeight, setScaledHeight] = useState(null);
  const outerRef = useRef(null);
  const tableWrapRef = useRef(null);

  const product = PRODUCTS[productKey];
  const planMeta = product.plans[plan];
  const genderIdx = gender === "female" ? 0 : 1;
  const ageNum = Number(age);
  const ageOutOfRange = age !== "" && (isNaN(ageNum) || ageNum < product.minAge || ageNum > product.maxAge);
  const rate = planMeta.rows[ageNum]?.[genderIdx];
  const freq = FREQ[freqKey];

  // สลับกลุ่มผลิตภัณฑ์แล้วปรับอายุเริ่มต้นให้อยู่ในช่วงที่ถูกต้องอัตโนมัติ
  useEffect(() => {
    if (age === "") return;
    if (isNaN(ageNum)) return;
    if (ageNum < product.minAge || ageNum > product.maxAge) {
      setAge(String(productKey === "kids" ? 5 : 23));
    }
  }, [productKey]); // eslint-disable-line react-hooks/exhaustive-deps

  // ถ้ายังไม่ได้เลือกกลุ่มผลิตภัณฑ์เอง ให้เลือกให้อัตโนมัติตามอายุที่กรอก (อีกวิธีในการเลือกแผน)
  useEffect(() => {
    if (!productAuto) return;
    if (age === "") return;
    const n = Number(age);
    if (isNaN(n)) return;
    if (n >= 0 && n <= 14 && productKey !== "kids") {
      setProductKey("kids");
    } else if (n >= 15 && n <= 65 && productKey !== "adult") {
      setProductKey("adult");
    }
  }, [age, productAuto]); // eslint-disable-line react-hooks/exhaustive-deps

  const { annualPremiumDisplay, sumInsured, belowMin } = useMemo(() => {
    if (!rate) return { annualPremiumDisplay: 0, sumInsured: 0, belowMin: false };
    if (mode === "premium") {
      const perInstallment = Number(premiumInput) || 0;
      const annualDisplay = perInstallment * freq.perYear;
      const annualForSI = (perInstallment + ROUNDING_EDGE) * freq.perYear;
      const si = Math.floor((annualForSI * 1000) / rate);
      return { annualPremiumDisplay: annualDisplay, sumInsured: si, belowMin: perInstallment < freq.min };
    } else {
      const si = Number(sumInsuredInput) || 0;
      const annual = (si * rate) / 1000;
      const perInstallment = annual / freq.perYear;
      return { annualPremiumDisplay: annual, sumInsured: si, belowMin: perInstallment < freq.min };
    }
  }, [mode, premiumInput, sumInsuredInput, rate, freq]);

  const perInstallmentDisplay =
    mode === "premium" ? Number(premiumInput) || 0 : annualPremiumDisplay / freq.perYear;

  const rows = useMemo(() => {
    const out = [];
    let cumPremium = 0;
    let cumBonus = 0;
    for (let i = 1; i <= planMeta.term; i++) {
      const isPayYear = i <= planMeta.pay;
      const premiumThisYear = isPayYear ? annualPremiumDisplay : 0;
      const bonusThisYear = isPayYear ? annualPremiumDisplay * planMeta.bonus : 0;
      cumPremium += premiumThisYear;
      cumBonus += bonusThisYear;
      out.push({
        year: i, age: isNaN(ageNum) ? null : ageNum + i - 1, isPayYear,
        premiumThisYear, cumPremium, bonusThisYear, cumBonus,
        isMaturity: i === planMeta.term,
      });
    }
    return out;
  }, [planMeta, annualPremiumDisplay, ageNum]);

  const totals = rows[rows.length - 1] || { cumPremium: 0, cumBonus: 0 };

  // คำนวณอัตราส่วนย่อตารางให้พอดีความกว้างหน้าจอ เมื่อเปิดโหมด "ย่อให้พอดีจอ"
  useLayoutEffect(() => {
    function recompute() {
      if (!fitScreen || !tableWrapRef.current || !outerRef.current) {
        setScale(1);
        setScaledHeight(null);
        return;
      }
      const naturalWidth = tableWrapRef.current.scrollWidth;
      const containerWidth = outerRef.current.clientWidth;
      if (!naturalWidth || !containerWidth) return;
      const s = Math.min(1, containerWidth / naturalWidth);
      setScale(s);
      setScaledHeight(tableWrapRef.current.scrollHeight * s);
    }
    recompute();
    window.addEventListener("resize", recompute);
    return () => window.removeEventListener("resize", recompute);
  }, [fitScreen, rows, plan, productKey]);
  const maturityPayout = (totals.cumPremium || 0) + (totals.cumBonus || 0);

  const irr = useMemo(() => {
    if (!annualPremiumDisplay || !maturityPayout) return null;
    const cashflows = new Array(planMeta.term + 1).fill(0);
    rows.forEach((r, idx) => {
      if (r.isPayYear) cashflows[idx] -= r.premiumThisYear;
    });
    cashflows[planMeta.term] += maturityPayout;
    return calcIRR(cashflows);
  }, [rows, planMeta, annualPremiumDisplay, maturityPayout]);
  const deathBenefitGeneral = sumInsured + maturityPayout;
  const deathBenefitAccident = sumInsured * 2 + maturityPayout;
  const monthlyPremiumForMedical = annualPremiumDisplay / 12;
  const medicalCap = monthlyPremiumForMedical * 5;
  const accident100 = sumInsured;
  const accident60 = sumInsured * 0.6;
  const accident25 = sumInsured * 0.25;
  const criticalIllness4 = sumInsured * 0.5;
  const payerProtection50 = sumInsured * 0.5;

  const isKids = productKey === "kids";

  // คำนวณเบี้ย "คช." (คุ้มครองการชำระเบี้ย) - เบี้ยเพิ่มเติมที่ผู้ปกครองต้องจ่ายแยกต่างหาก
  const guardianAgeNum = Number(guardianAge);
  const guardianAgeOutOfRange = isKids && guardianAge !== "" && (isNaN(guardianAgeNum) || guardianAgeNum < 20 || guardianAgeNum > 55);
  const korChorPeriodRaw = isKids && !isNaN(ageNum) && !isNaN(guardianAgeNum) && !guardianAgeOutOfRange
    ? Math.min(planMeta.pay, 21 - ageNum, 65 - guardianAgeNum)
    : null;
  const korChorPeriod = korChorPeriodRaw !== null ? Math.max(2, Math.min(21, korChorPeriodRaw)) : null;
  const korChorBracket = isKids && !isNaN(guardianAgeNum) && !guardianAgeOutOfRange ? korChorAgeBracket(guardianAgeNum) : null;
  const korChorRate = korChorPeriod && korChorBracket ? KOR_CHOR_RATES[guardianGender][korChorBracket]?.[korChorPeriod] : null;
  const korChorPremiumAnnual = korChorRate != null ? (annualPremiumDisplay * korChorRate) / 100 : null;
  const korChorPremiumPerInstallment = korChorPremiumAnnual != null ? korChorPremiumAnnual / freq.perYear : null;

  const pillBase = "rounded-xl py-2.5 sm:py-3 text-sm sm:text-base font-semibold transition-colors";
  const pillOn = "bg-blue-900 text-white";
  const pillOff = "bg-sky-50 text-slate-500 border border-sky-200";
  const inputCls = "w-full rounded-xl bg-sky-50 border border-sky-200 px-4 py-3 text-base text-slate-800 outline-none focus:border-blue-700";

  return (
    <div className="min-h-screen w-full bg-sky-50 text-slate-800 print:bg-white" style={{ fontFamily: "'Noto Sans Thai','IBM Plex Mono',sans-serif" }}>
      <div className="max-w-5xl mx-auto px-3 sm:px-4 md:px-6 py-4 sm:py-6 pb-16 print:px-0 print:py-0">
        {/* Header */}
        <div className="flex items-center gap-3 mb-6 print:hidden">
          <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-gradient-to-br from-blue-800 to-blue-950 flex items-center justify-center shrink-0 shadow-md">
            <Shield size={22} className="text-white sm:hidden" />
            <Shield size={24} className="text-white hidden sm:block" />
          </div>
          <div>
            <div className="text-xs sm:text-sm tracking-[0.15em] sm:tracking-[0.2em] text-blue-800 uppercase font-semibold">กรุงเทพประกันชีวิต</div>
            <h1 className="text-lg sm:text-2xl font-bold leading-tight text-slate-900">{product.productName} — ตัวช่วยคำนวณผลประโยชน์</h1>
          </div>
        </div>

        {/* Controls card */}
        <div className="bg-white rounded-2xl p-4 sm:p-5 mb-5 border border-sky-100 shadow-sm print:hidden">
          {/* Product family */}
          <div className="mb-5">
            <div className="text-sm text-slate-500 mb-2 font-medium flex items-center gap-2">
              กลุ่มผลิตภัณฑ์
              {productAuto && (
                <span className="text-xs font-normal text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
                  เลือกอัตโนมัติตามอายุ
                </span>
              )}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <button
                onClick={() => { setProductKey("adult"); setProductAuto(false); }}
                className={`${pillBase} flex items-center justify-center gap-2 ${productKey === "adult" ? pillOn : pillOff}`}
              >
                <User size={18} /> ผู้ใหญ่ (สุดคุ้ม)
              </button>
              <button
                onClick={() => { setProductKey("kids"); setProductAuto(false); }}
                className={`${pillBase} flex items-center justify-center gap-2 ${productKey === "kids" ? pillOn : pillOff}`}
              >
                <Baby size={18} /> เด็ก (สมาร์ท คิดส์)
              </button>
            </div>
            {!productAuto && (
              <button
                onClick={() => setProductAuto(true)}
                className="mt-2 text-xs text-blue-700 font-medium underline"
              >
                กลับไปเลือกอัตโนมัติตามอายุ
              </button>
            )}
          </div>

          <div className="mb-5">
            <div className="text-sm text-slate-500 mb-2 font-medium">แบบประกัน</div>
            <div className="grid grid-cols-3 gap-2">
              {Object.keys(product.plans).map((p) => (
                <button key={p} onClick={() => setPlan(p)} className={`${pillBase} ${plan === p ? pillOn : pillOff}`}>
                  {p}
                </button>
              ))}
            </div>
            <div className="text-sm text-slate-400 mt-2">
              ระยะเวลาเอาประกัน {planMeta.term} ปี · ชำระเบี้ย {planMeta.pay} ปี · เงินคืนพิเศษ {(planMeta.bonus * 100).toFixed(0)}%
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-2">
            <div>
              <div className="text-sm text-slate-500 mb-2 font-medium">เพศ</div>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setGender("male")} className={`${pillBase} ${gender === "male" ? pillOn : pillOff}`}>ชาย</button>
                <button onClick={() => setGender("female")} className={`${pillBase} ${gender === "female" ? pillOn : pillOff}`}>หญิง</button>
              </div>
            </div>
            <div>
              <div className="text-sm text-slate-500 mb-2 font-medium">อายุ ({product.minAge}–{product.maxAge} ปี)</div>
              <NumberField
                value={age}
                onChange={(raw) => setAge(raw)}
                className={`${inputCls} ${ageOutOfRange ? "border-orange-400 focus:border-orange-500" : ""}`}
              />
            </div>
          </div>

          {ageOutOfRange && (
            <div className="mb-4 text-sm text-orange-600 flex gap-1.5">
              <Info size={16} className="shrink-0 mt-0.5" />

          {isKids && (
            <div className="mb-5 pt-4 border-t border-sky-100">
              <div className="text-sm text-slate-500 mb-2 font-medium">ข้อมูลผู้ปกครอง (ผู้ชำระเบี้ย) — สำหรับคำนวณเบี้ย คช.</div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="text-sm text-slate-500 mb-2 font-medium">เพศผู้ปกครอง</div>

          <div className="mb-4">

              <button onClick={() => setMode("sumInsured")} className={`${pillBase} ${mode === "sumInsured" ? pillOn : pillOff}`}>ทุนประกันที่ต้องการ</button>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <div className="text-sm text-slate-500 mb-2 font-medium">งวดชำระเบี้ย</div>

                <select

                  className="w-full appearance-none rounded-xl bg-sky-50 border border-sky-200 px-4 py-3 text-base text-slate-800 outline-none focus:border-blue-700"

                <ChevronDown size={18} className="absolute right-3 top-3.5 text-slate-400 pointer-events-none" />

            </div>
            <div>
              <div className="text-sm text-slate-500 mb-2 font-medium">
                {mode === "premium" ? "เบี้ยต่องวด (บาท)" : "ทุนประกันที่ต้องการ (บาท)"}
              </div>
              <NumberField
                value={mode === "premium" ? premiumInput : sumInsuredInput}
                onChange={(raw) => mode === "premium" ? setPremiumInput(raw) : setSumInsuredInput(raw)}
                className={inputCls}
              />
            </div>
          </div>

          {belowMin && (
            <div className="mt-3 text-sm text-orange-600 flex gap-1.5">
              <Info size={16} className="shrink-0 mt-0.5" />
              เบี้ยต่องวด ({fmt(perInstallmentDisplay)} บาท) ต่ำกว่าเบี้ยขั้นต่ำของงวด{freq.label} ({fmt(freq.min)} บาท)

          )}
        </div>

        {/* Print-only summary header */}
        <div className="hidden print:block mb-4 pb-3 border-b-2 border-blue-900">

          <div className="text-lg font-bold text-slate-900">
            {gender === "male" ? "ชาย" : "หญิง"} อายุ {age} ปี · {freq.label} {fmt(perInstallmentDisplay)} บาท · ทุนประกัน {fmt(sumInsured)} บาท
          </div>

        {/* ===== Table ===== */}
        <div className="bg-white rounded-2xl border border-sky-100 shadow-md overflow-hidden print:shadow-none print:border-slate-300">
          <div className="flex flex-wrap items-center justify-between gap-3 px-5 py-4 bg-gradient-to-r from-blue-900 to-blue-800 print:hidden">
            <div className="text-white">
              <div className="text-sm text-sky-200 uppercase tracking-wide">แผน {product.productName} {plan}</div>
              <div className="text-xl font-bold">{freq.label} {fmt(perInstallmentDisplay)} บาท</div>
            </div>
            <div className="flex items-center gap-2 flex-wrap justify-end">
              <div className="text-sky-100 text-base font-medium">{gender === "male" ? "ชาย" : "หญิง"} อายุ {age} ปี</div>
              <button
                onClick={() => setFitScreen((v) => !v)}
                className={`flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold transition-colors ${
                  fitScreen ? "bg-white text-blue-900" : "bg-white/15 hover:bg-white/25 text-white"
                }`}
              >
                {fitScreen ? "ขนาดเต็ม (เลื่อนดู)" : "ย่อให้พอดีจอ"}
              </button>
              <button
                onClick={() => window.print()}
                className="flex items-center gap-2 rounded-xl bg-white/15 hover:bg-white/25 text-white px-4 py-2 text-sm font-semibold transition-colors"
              >
                <Printer size={16} /> พิมพ์ PDF ให้ลูกค้า
              </button>
            </div>
          </div>

          {!fitScreen && (
            <div className="sm:hidden text-center text-xs text-slate-400 py-1.5 bg-sky-50 border-b border-sky-100">
              ← เลื่อนดูตารางด้านข้าง →
            </div>
          )}
          <div
            ref={outerRef}
            className={fitScreen ? "overflow-hidden" : "overflow-x-auto"}
            style={fitScreen && scaledHeight ? { height: `${scaledHeight}px` } : undefined}
          >
            <div
              ref={tableWrapRef}
              style={
                fitScreen
                  ? { transform: `scale(${scale})`, transformOrigin: "top left", width: `${100 / scale}%` }
                  : undefined
              }
            >
            <table className="w-full text-sm border-collapse min-w-[760px]">
              <thead>
                <tr>
                  <th className="border border-sky-100 bg-sky-50 px-3 py-3 text-slate-700 font-semibold w-16 text-base text-center">
                    อายุ<br /><span className="font-normal text-xs text-slate-400">Age</span>
                  </th>
                  <th className="border border-sky-100 bg-sky-50 px-3 py-3 text-slate-700 font-semibold w-32 text-base text-center">
                    เบี้ยประกันสะสม<br /><span className="font-normal text-xs text-slate-400">Annual Premium</span>
                  </th>
                  <th className="border border-sky-100 bg-sky-50 px-3 py-3 text-slate-700 font-semibold w-32 text-base text-center">
                    เงินจ่ายคืนพิเศษ<br /><span className="font-normal text-xs text-slate-400">{(planMeta.bonus * 100).toFixed(0)}% เมื่อครบ/เสียชีวิต</span>
                  </th>
                  <th className="border border-sky-100 bg-blue-100 px-4 py-3 text-blue-900 font-semibold w-48 text-base text-center">
                    ทุนประกัน
                    <div className="text-xl font-bold mt-1">{fmt(sumInsured)}</div>
                  </th>
                  <th className="border border-sky-100 bg-emerald-50 px-4 py-3 text-emerald-900 font-semibold text-left text-base">
                    ความคุ้มครองระหว่างสัญญา
                  </th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, idx) => (
                  <tr key={r.year} className={r.isMaturity ? "bg-emerald-50/70" : idx % 2 === 0 ? "bg-slate-50/50" : ""}>
                    <td className="border border-sky-100 px-3 py-2.5 text-center font-semibold text-slate-800 text-base">{r.age ?? "—"}</td>
                    <td className="border border-sky-100 px-3 py-2.5 text-center text-slate-800 text-base">
                      {r.isPayYear ? fmt(r.premiumThisYear) : <span className="text-slate-300">—</span>}
                    </td>
                    <td className="border border-sky-100 px-3 py-2.5 text-center text-blue-800 font-medium text-base">
                      {r.isPayYear ? fmt(r.bonusThisYear) : <span className="text-slate-300">—</span>}
                    </td>

                    {idx === 0 && (
                      <td rowSpan={rows.length} className="border border-sky-100 px-4 py-3 align-top bg-blue-50/30">
                        <div className="text-sm text-slate-600 leading-relaxed space-y-3">
                          <div>
                            <span className="font-semibold text-slate-800">1. มีชีวิตอยู่ครบสัญญา</span><br />
                            รับเบี้ยสะสม + เงินคืนพิเศษ<br />
                            <span className="font-bold text-blue-800 text-lg">{fmt(maturityPayout)} บาท</span>
                          </div>
                          <div className="h-px bg-sky-200" />
                          <div>
                            <span className="font-semibold text-slate-800">2. เสียชีวิตทั่วไป</span><br />
                            ทุนประกัน + เบี้ยสะสม + เงินคืนพิเศษ<br />
                            <span className="font-bold text-emerald-700 text-lg">{fmt(deathBenefitGeneral)} บาท</span><br />
                            <span className="text-xs text-slate-400">(สูงสุดเมื่อชำระเบี้ยประกันครบ)</span>
                          </div>
                          <div className="h-px bg-sky-200" />
                          <div>
                            <span className="font-semibold text-slate-800">3. เสียชีวิตจากอุบัติเหตุ</span><br />
                            ทุนประกัน x 2 + เบี้ยสะสม + เงินคืนพิเศษ<br />
                            <span className="font-bold text-emerald-700 text-lg">{fmt(deathBenefitAccident)} บาท</span><br />
                            <span className="text-xs text-slate-400">(สูงสุดเมื่อชำระเบี้ยประกันครบ)</span>
                          </div>
                        </div>
                      </td>
                    )}

                    {idx === 0 && (
                      <td rowSpan={rows.length} className="border border-sky-100 px-4 py-3 align-top">
                        <div className="flex items-center gap-1.5 text-emerald-700 text-sm font-bold mb-3">
                          <Gift size={16} /> แถมฟรี — คุ้มครองอุบัติเหตุ
                        </div>
                        <ul className="space-y-3 text-sm text-slate-600">
                          <li>
                            ค่ารักษาพยาบาลจากอุบัติเหตุ (ตามจริง)<br />
                            <span className="font-semibold text-slate-800 text-base">ไม่เกิน {fmt(medicalCap)} บาท</span>
                            <div className="text-xs text-slate-400">สูงสุด 5 เท่าของเบี้ยรายเดือน ต่อครั้ง</div>
                          </li>
                          <li>
                            สูญเสียมือ/เท้า 2 ข้าง หรือสายตา (100%)<br />
                            <span className="font-semibold text-slate-800 text-base">{fmt(accident100)} บาท</span>
                          </li>
                          <li>
                            สูญเสียมือ/เท้า/สายตา 1 ข้าง (60%)<br />

                          </li>

                            <span className="font-semibold text-slate-800 text-base">{fmt(accident25)} บาท</span>
                          </li>

                                <span className="text-xs text-slate-400">ไข้รูมาติกที่มีผลต่อหัวใจ, คาวาซากิที่มีภาวะแทรกซ้อนหัวใจ, เบาหวาน, ภาวะน้ำคั่งในสมองที่ต้องใส่ท่อระบาย — จะคุ้มครองไปจนน้อง (ผู้เอาประกันภัย) มีอายุครบ 21 ปี หรือจนกว่าจะหมดระยะเวลาชำระเบี้ยประกันภัย (แล้วแต่ว่าเวลาไหนจะถึงก่อนกัน)</span>

                              </li>
                            </>

              </tbody>
              <tfoot>
                <tr className="bg-sky-100 font-semibold">
                  <td className="border border-sky-100 px-3 py-3 text-center text-slate-700 text-base">รวม</td>
                  <td className="border border-sky-100 px-3 py-3 text-center text-slate-800 text-base">{fmt(totals.cumPremium)}</td>
                  <td className="border border-sky-100 px-3 py-3 text-center text-blue-800 text-base">{fmt(totals.cumBonus)}</td>
                  <td className="border border-sky-100" colSpan={2}></td>
                </tr>
                <tr className="bg-emerald-100 font-bold">
                  <td className="border border-sky-100 px-3 py-4 text-center text-emerald-900 text-base" colSpan={3}>
                    ครบสัญญา รับเงิน
                  </td>
                  <td className="border border-sky-100 px-3 py-4 text-center text-emerald-900 text-xl" colSpan={2}>
                    {fmt(maturityPayout)} บาท
                  </td>
                </tr>
              </tfoot>
            </table>
            </div>
          </div>
          <div className="px-4 py-2 text-right text-sm text-gray-700 font-medium border-t border-sky-100">
            {irr != null ? `IRR (ผลตอบแทนเมื่อครบสัญญา): ${(irr * 100).toFixed(2)}% ต่อปี` : "IRR: คำนวณไม่ได้"}
          </div>
        </div>

        <div className="text-sm text-slate-400 mt-4 leading-relaxed flex gap-2 print:hidden">
          <Info size={16} className="shrink-0 mt-0.5" />
          ตัวเลขคำนวณจากอัตราเบี้ยประกันภัยทางการของบริษัทและเป็นค่าประมาณเพื่อประกอบการนำเสนอเท่านั้น เงินคืนพิเศษและผลประโยชน์กรณีเสียชีวิตจ่ายจริงตามเงื่อนไขกรมธรรม์ โรคร้ายแรง 4 โรคและคุ้มครองผู้ชำระเบี้ย (คช.) สำหรับเด็กเป็นผลประโยชน์จากสัญญาเพิ่มเติมที่ต้องซื้อแนบ เบี้ย คช. คำนวณจากเบี้ยกรมธรรม์หลักเพียงอย่างเดียว หากแนบสัญญาเพิ่มเติมอื่น (เช่น ซีไอ คิดส์) เบี้ยจริงจะสูงกว่านี้เล็กน้อยเนื่องจากฐานเบี้ยที่ใช้คำนวณ คช. จะรวมเบี้ยของสัญญาเพิ่มเติมนั้นด้วย โปรดยืนยันตัวเลขกับใบเสนอราคาจริงก่อนนำเสนอลูกค้า
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SudKoomDashboard />);
</script>
</body>
</html>
